[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nem-dispatch-simulator"
version = "1.0.0"
authors = [
  { name="Dr. Md Mahmudur Rahman", email="mahmud05@gmail.com" },
]
description = "Open-Source NEM Unit Commitment & Economic Dispatch Simulator in Python (HiGHS LP)"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "plotly>=5.15.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
nem-sim = "nem_simulator.cli:main"
